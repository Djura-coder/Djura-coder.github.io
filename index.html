<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> Regalo </title>
  <style>
    body{
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;
    }
    .card{
      background:rgba(255,255,255,0.9);
      border-radius:20px;
      padding:32px;
      box-shadow:0 8px 40px rgba(0,0,0,0.15);
      text-align:center;
      animation: pop 0.6s ease;
      max-width:400px;
    }
    @keyframes pop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
    h1{margin:0 0 16px;font-size:26px;color:#d63384;text-shadow:1px 1px 0 #fff}
    .row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
    input[type="text"]{
      flex:1;
      padding:10px 12px;
      border-radius:12px;
      border:2px solid #d63384;
      font-size:16px;
      outline:none;
    }
    button{
      padding:10px 18px;
      border-radius:12px;
      border:0;
      background:#ff4d6d;
      color:white;
      font-weight:700;
      cursor:pointer;
    }
    .hint{color:#444;font-size:14px;margin-bottom:16px}
    .gift{font-size:60px;cursor:pointer;}
    .result{margin-top:20px;}
    .result img{max-width:100%;border-radius:12px;display:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1> ¿Cuál es tu nombre :D? </h1>

    <div class="row">
      <input id="nameInput" placeholder="Escribe tu nombre..." autofocus />
      <button id="checkBtn">Descubrir</button>
    </div>

    <div class="hint">Si escribes tu nombre, podrás abrir un pedazo de regalo</div>

    <div id="giftContainer" style="display:none;">
      <div class="gift" id="gift">🎁</div>
    </div>

    <div class="result">
      <img id="imgNatalia" src="dedo.jpg" width="50%" alt="Sorpresa Natalia" />
      <img id="imgOtro" src="pulgar.jpeg" alt="Sorpresa Otro" />
    </div>

    <audio id="soundNatalia" src="rock.mp3"></audio>
    <audio id="soundOtro" src="bien.mp3"></audio>
  </div>

  <script>
    const input = document.getElementById('nameInput');
    const btn = document.getElementById('checkBtn');
    const giftContainer = document.getElementById('giftContainer');
    const gift = document.getElementById('gift');
    const imgN = document.getElementById('imgNatalia');
    const imgO = document.getElementById('imgOtro');
    const sndN = document.getElementById('soundNatalia');
    const sndO = document.getElementById('soundOtro');

    let isNatalia = false;

    function resetAll(){
      imgN.style.display = 'none';
      imgO.style.display = 'none';
      sndN.pause(); sndN.currentTime = 0;
      sndO.pause(); sndO.currentTime = 0;
    }

    btn.addEventListener('click', () => {
      const name = input.value.trim().toLowerCase();
      resetAll();
      giftContainer.style.display = 'block';

      const nombresValidos = ['natalia', 'natt', 'natty'];
      isNatalia = nombresValidos.includes(name);

      alert(isNatalia ? 'Toma tu regalo 💖' : 'Toma un regalo pa ti guap@ 😌');
    });

    gift.addEventListener('click', () => {
      resetAll();
      if(isNatalia){
        imgN.style.display = 'block';
        sndN.play().catch(()=>{});
      } else {
        imgO.style.display = 'block';
        sndO.play().catch(()=>{});
      }
    });

    input.addEventListener('keydown', e => {
      if(e.key === 'Enter') btn.click();
    });

    resetAll();
  </script>
</body>
</html>
